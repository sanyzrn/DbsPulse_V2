[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: pycodestyle، F: pyflakes، I: مرتب‌سازی import ها، B: bugbear، UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B008",  # الگوی استاندارد FastAPI: Depends() در مقدار پیش‌فرض پارامتر
    "UP042", # مهاجرت به StrEnum رفتار serialization را عوض می‌کند؛ آگاهانه به تعویق افتاده
]
