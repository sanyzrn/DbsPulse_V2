# محیط مشترک بین سرویس migrate و backend — باید یکی باشند، وگرنه مایگریشن روی یک
# دیتابیس اجرا می‌شود و اپ به دیتابیس دیگری وصل می‌شود.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://dbspulse:${POSTGRES_PASSWORD:-dbspulse_dev_password}@db:5432/dbspulse
  # هشدار: مقادیر پیش‌فرض فقط برای اجرای محلی/دمو مناسب‌اند.
  # پیش از استقرار واقعی، در فایل .env کنار همین docker-compose.yml مقادیر
  # ENVIRONMENT=production و یک JWT_SECRET_KEY تصادفی و طولانی تنظیم کنید
  # (در غیر این صورت برنامه در حالت production عمداً استارت نمی‌شود).
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-string}
  # کاربران نمونه با رمز مشترکِ منتشرشده. فقط برای دمو/توسعه؛ در production روشن
  # کردنش باعث خطای صریح استارت‌آپ می‌شود.
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  # این دو تا امروز اصلاً به کانتینر پاس داده نمی‌شدند، یعنی با ENVIRONMENT=production
  # اپ روی مقدار پیش‌فرضِ localhost می‌ماند و گارد استارت‌آپ جلویش را می‌گرفت —
  # استقرار production با همین compose عملاً ممکن نبود.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  # در production به IP/شبکهٔ پروکسی محدودش کنید؛ با «*» هدر جعلی X-Forwarded-For
  # محدودیت نرخ ورود را دور می‌زند.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
  # خالی = شمارندهٔ محدودیت نرخ در حافظهٔ همان پروسه. برای چند replica یک backend
  # مشترک بدهید (مثلاً redis://redis:6379).
  RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
  ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbspulse_dev_password}
      POSTGRES_DB: dbspulse
    ports:
      # فقط روی loopback؛ دیتابیس نباید از شبکه بیرونی قابل دسترسی باشد
      - "127.0.0.1:5432:5432"
    volumes:
      - dbspulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbspulse -d dbspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # مایگریشن‌ها یک job جداگانه‌اند، نه بخشی از بوت اپ: در rollout چندنسخه‌ای نباید
  # چند replica هم‌زمان schema را عوض کنند، و تغییر schema باید یک قدم صریح باشد.
  # یک‌بار اجرا می‌شود، تا پایان موفق منتظر می‌مانیم، بعد بک‌اند بالا می‌آید.
  migrate:
    build: ./backend
    # نام صریح، تا `docker save dbspulse-backend` و `docker-compose.prod.yml`
    # همان ایمیجی را ببینند که این‌جا ساخته می‌شود؛ بدون این، نام از روی نام
    # پوشهٔ پروژه ساخته می‌شود و روی هر ماشین می‌تواند فرق کند.
    image: dbspulse-backend
    command: alembic upgrade head
    restart: "no"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: dbspulse-backend
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # فقط روی loopback برای دیباگ محلی؛ ترافیک اصلی از طریق کانتینر frontend
      # (پروکسی /api) عبور می‌کند و بک‌اند نباید مستقیماً در معرض شبکه باشد.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    image: dbspulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbspulse_pgdata:
